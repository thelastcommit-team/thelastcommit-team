<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="How we hack: idea, prototype, demo, ship"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090a12"/><stop offset="1" stop-color="#12131f"/></linearGradient><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5eead4"/></linearGradient><radialGradient id="g1" cx="0" cy="0" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="1" cy="1" r="1"><stop offset="0" stop-color="#5eead4" stop-opacity=".22"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".06"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="900" height="190" rx="18" fill="url(#bg)"/><rect x=".5" y=".5" width="899" height="189" rx="18" fill="none" stroke="#fff" stroke-opacity=".09"/><text x="30" y="42" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#eceaf6">How we hack</text><text x="870" y="42" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" fill="#8c8aa3">idea → prototype → demo → ship</text><path d="M30 118 L870 118" stroke="#fff" stroke-opacity=".14" stroke-width="2" stroke-dasharray="4 6"/><rect x="30" y="72" width="170" height="92" rx="14" fill="#12131f"/><rect x="30.5" y="72.5" width="169" height="91" rx="14" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.28;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><text x="48" y="98" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#8b5cf6">01</text><text x="48" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#eceaf6">Idea</text><text x="48" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c8aa3">Pick one sharp problem</text><rect x="253" y="72" width="170" height="92" rx="14" fill="#12131f"/><rect x="253.5" y="72.5" width="169" height="91" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.28;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect><text x="271" y="98" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#a78bfa">02</text><text x="271" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#eceaf6">Prototype</text><text x="271" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c8aa3">Make it work, ugly is fine</text><rect x="476" y="72" width="170" height="92" rx="14" fill="#12131f"/><rect x="476.5" y="72.5" width="169" height="91" rx="14" fill="none" stroke="#7dd3c8" stroke-width="1.8" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.28;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></rect><text x="494" y="98" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#7dd3c8">03</text><text x="494" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#eceaf6">Demo</text><text x="494" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c8aa3">Show it, do not explain it</text><rect x="699" y="72" width="170" height="92" rx="14" fill="#12131f"/><rect x="699.5" y="72.5" width="169" height="91" rx="14" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-opacity=".25"><animate attributeName="stroke-opacity" values=".25;1;.25;.25" keyTimes="0;.1;.28;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></rect><text x="717" y="98" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#5eead4">04</text><text x="717" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#eceaf6">Ship</text><text x="717" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c8aa3">Merge before the buzzer</text><circle r="9" fill="#5eead4" opacity=".4" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M30 118 L870 118"/></circle><circle r="3.5" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M30 118 L870 118"/></circle></svg>